name: ERROR Messenger Public Android APK
on:
  push:
    branches:
      - error-messenger-apk-public
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract ERROR messenger source
        run: |
          mkdir android-app
          base64 --decode ERROR_android_source.b64 | tar -xz -C android-app
      - name: Replace WebView with native Android
        run: |
          cp native-android/MainActivity.java android-app/app/src/main/java/com/error/messenger/MainActivity.java
          cp native-android/AndroidManifest.xml android-app/app/src/main/AndroidManifest.xml
          cp native-android/build.gradle android-app/app/build.gradle
          mkdir -p android-app/app/src/main/res/drawable
          cp android-app/app/src/main/assets/error_logo_transparent.png android-app/app/src/main/res/drawable/error_logo.png
          test ! -e android-app/app/src/main/assets/index.html || echo "Legacy web assets ignored by native Activity"
      - name: Build installable APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Publish public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "error-messenger-native-v0.3-public" \
            "android-app/app/build/outputs/apk/debug/app-debug.apk#ERROR-Native-Android-v0.3.apk" \
            --target "$GITHUB_SHA" \
            --title "ERROR Messenger - Native Android v0.3" \
            --notes "Fully native Android Activity, not WebView. Nearby messaging, photos and voice code; requires testing on two real phones. Online backend is not configured. Uninstall previous ERROR test APK before installation due to debug signing differences." \
            --prerelease
